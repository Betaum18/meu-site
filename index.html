<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa de Containers — Porto de Los Santos</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0d0f; font-family:'Rajdhani',sans-serif; overflow:hidden; height:100vh; width:100vw; user-select:none; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:200;
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 20px;
    background:linear-gradient(180deg,rgba(0,0,0,.9) 0%,transparent 100%);
    pointer-events:none;
  }
  #hud .title { font-family:'Share Tech Mono',monospace; font-size:13px; letter-spacing:4px; text-transform:uppercase; color:#e8c84a; text-shadow:0 0 12px rgba(232,200,74,.6); }
  #hud .counter { font-family:'Share Tech Mono',monospace; font-size:11px; color:rgba(255,255,255,.5); letter-spacing:2px; }
  #hud .counter span { color:#e8c84a; }

  #toolbar {
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
    z-index:200; display:flex; gap:10px; align-items:center;
    background:rgba(0,0,0,.85); border:1px solid rgba(232,200,74,.3);
    border-radius:8px; padding:10px 16px; backdrop-filter:blur(10px);
  }
  #toolbar button {
    font-family:'Share Tech Mono',monospace; font-size:11px; letter-spacing:2px;
    text-transform:uppercase; padding:7px 14px; border-radius:4px;
    border:1px solid rgba(255,255,255,.15); cursor:pointer; transition:all .15s;
  }
  #btn-add { background:rgba(232,200,74,.15); color:#e8c84a; border-color:rgba(232,200,74,.5); }
  #btn-add:hover { background:rgba(232,200,74,.3); }
  #btn-add.active { background:#e8c84a; color:#000; box-shadow:0 0 16px rgba(232,200,74,.6); }
  #btn-del { background:rgba(255,60,60,.1); color:#ff4444; border-color:rgba(255,60,60,.4); }
  #btn-del:hover { background:rgba(255,60,60,.25); }
  #btn-del.active { background:#ff4444; color:#fff; box-shadow:0 0 16px rgba(255,60,60,.5); }
  #btn-reset-view { background:rgba(255,255,255,.05); color:rgba(255,255,255,.6); border-color:rgba(255,255,255,.15); }
  #btn-reset-view:hover { background:rgba(255,255,255,.1); color:#fff; }
  .toolbar-sep { width:1px; height:24px; background:rgba(255,255,255,.15); margin:0 4px; }
  #mode-label { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(255,255,255,.35); letter-spacing:1px; white-space:nowrap; }

  #zoom-ctrl { position:fixed; right:20px; bottom:20px; z-index:200; display:flex; flex-direction:column; gap:4px; }
  #zoom-ctrl button {
    width:34px; height:34px; background:rgba(0,0,0,.8); border:1px solid rgba(255,255,255,.2);
    color:rgba(255,255,255,.7); font-size:18px; border-radius:4px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; font-family:monospace;
  }
  #zoom-ctrl button:hover { background:rgba(255,255,255,.15); color:#fff; }

  /* Loading overlay */
  #loading {
    position:fixed; inset:0; z-index:500;
    background:#0a0d0f;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  }
  #loading .load-title { font-family:'Share Tech Mono',monospace; font-size:13px; letter-spacing:4px; color:#e8c84a; text-transform:uppercase; }
  #loading .load-sub { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(255,255,255,.3); letter-spacing:2px; }
  .spinner {
    width:32px; height:32px; border:2px solid rgba(232,200,74,.2);
    border-top-color:#e8c84a; border-radius:50%; animation:spin .8s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  #map-wrapper { width:100vw; height:100vh; overflow:hidden; cursor:grab; position:relative; }
  #map-wrapper.cursor-add { cursor:crosshair !important; }
  #map-wrapper.cursor-del { cursor:not-allowed !important; }
  #map-wrapper:active:not(.cursor-add):not(.cursor-del) { cursor:grabbing; }
  #map-container { position:absolute; transform-origin:0 0; }
  #map-img { display:block; max-width:none; }

  .pt { position:absolute; width:22px; height:22px; transform:translate(-50%,-50%); cursor:pointer; z-index:50; }
  .pt-inner {
    width:14px; height:14px; border-radius:50%; background:#ff3a3a;
    border:2px solid rgba(255,255,255,.8); box-shadow:0 0 8px rgba(255,58,58,.9);
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    transition:background .2s, box-shadow .2s;
  }
  .pt.has-photo .pt-inner { background:#3aff7a; box-shadow:0 0 10px rgba(58,255,122,.9); }
  .pt-pulse {
    position:absolute; width:22px; height:22px; border-radius:50%;
    border:2px solid #ff3a3a; top:50%; left:50%; transform:translate(-50%,-50%);
    animation:pulse 1.8s ease-out infinite; pointer-events:none;
  }
  .pt.has-photo .pt-pulse { border-color:#3aff7a; }
  @keyframes pulse {
    0%   { transform:translate(-50%,-50%) scale(1); opacity:.9; }
    100% { transform:translate(-50%,-50%) scale(2.2); opacity:0; }
  }

  /* Modal */
  #modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.75);
    z-index:300; align-items:center; justify-content:center; backdrop-filter:blur(4px);
  }
  #modal-overlay.open { display:flex; }
  #modal {
    background:#0f1215; border:1px solid rgba(232,200,74,.35); border-radius:8px;
    padding:24px; width:360px; max-width:92vw;
    box-shadow:0 0 40px rgba(0,0,0,.8);
  }
  #modal h2 { font-family:'Share Tech Mono',monospace; font-size:13px; letter-spacing:3px; color:#e8c84a; text-transform:uppercase; margin-bottom:4px; }
  #modal .modal-id { font-family:'Share Tech Mono',monospace; font-size:10px; color:rgba(255,255,255,.3); letter-spacing:2px; margin-bottom:14px; }

  #modal-photo-area {
    width:100%; height:150px; background:rgba(255,255,255,.04);
    border:2px dashed rgba(255,255,255,.15); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    margin-bottom:12px; overflow:hidden;
  }
  #modal-photo-area img { width:100%; height:100%; object-fit:cover; }
  #modal-photo-area .placeholder {
    text-align:center; color:rgba(255,255,255,.25); font-size:12px; letter-spacing:1px; pointer-events:none;
  }
  #modal-photo-area .placeholder svg { display:block; margin:0 auto 8px; opacity:.3; }

  .photo-tabs { display:flex; gap:6px; margin-bottom:10px; }
  .photo-tab {
    flex:1; padding:6px; border-radius:4px; font-family:'Share Tech Mono',monospace;
    font-size:10px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.4); transition:all .15s; text-align:center;
  }
  .photo-tab.active { background:rgba(232,200,74,.15); border-color:rgba(232,200,74,.5); color:#e8c84a; }
  .photo-tab:hover:not(.active) { background:rgba(255,255,255,.08); color:rgba(255,255,255,.7); }
  .tab-panel { display:none; margin-bottom:12px; }
  .tab-panel.active { display:block; }

  #btn-upload-file {
    width:100%; padding:8px; border-radius:4px; font-family:'Share Tech Mono',monospace;
    font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    border:1px dashed rgba(255,255,255,.2); background:rgba(255,255,255,.04);
    color:rgba(255,255,255,.5); transition:all .15s;
  }
  #btn-upload-file:hover { background:rgba(255,255,255,.08); border-color:rgba(255,255,255,.4); color:#fff; }

  .url-row { display:flex; gap:6px; }
  #modal-url-input {
    flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:4px; padding:8px 10px; color:#fff; font-family:'Share Tech Mono',monospace;
    font-size:11px; letter-spacing:1px; outline:none; transition:border-color .2s; min-width:0;
  }
  #modal-url-input:focus { border-color:rgba(232,200,74,.5); }
  #modal-url-input::placeholder { color:rgba(255,255,255,.2); font-size:10px; }
  #btn-load-url {
    padding:8px 12px; border-radius:4px; font-family:'Share Tech Mono',monospace;
    font-size:10px; letter-spacing:1px; text-transform:uppercase; cursor:pointer;
    border:1px solid rgba(232,200,74,.4); background:rgba(232,200,74,.12);
    color:#e8c84a; transition:all .15s; white-space:nowrap;
  }
  #btn-load-url:hover { background:rgba(232,200,74,.25); }

  #modal-name-input {
    width:100%; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.15);
    border-radius:4px; padding:8px 10px; color:#fff; font-family:'Rajdhani',sans-serif;
    font-size:15px; letter-spacing:1px; margin-bottom:14px; outline:none; transition:border-color .2s;
  }
  #modal-name-input:focus { border-color:rgba(232,200,74,.5); }
  #modal-name-input::placeholder { color:rgba(255,255,255,.25); }

  .modal-actions { display:flex; gap:8px; }
  .modal-actions button {
    flex:1; padding:9px; border-radius:4px; font-family:'Share Tech Mono',monospace;
    font-size:11px; letter-spacing:2px; text-transform:uppercase; cursor:pointer;
    border:1px solid transparent; transition:all .15s;
  }
  #btn-save { background:rgba(232,200,74,.2); border-color:rgba(232,200,74,.5); color:#e8c84a; }
  #btn-save:hover { background:rgba(232,200,74,.35); }
  #btn-close { background:rgba(255,255,255,.05); border-color:rgba(255,255,255,.15); color:rgba(255,255,255,.5); }
  #btn-close:hover { background:rgba(255,255,255,.1); color:#fff; }

  #toast {
    position:fixed; top:60px; left:50%; transform:translateX(-50%) translateY(-20px);
    background:rgba(0,0,0,.9); border:1px solid rgba(232,200,74,.4); border-radius:6px;
    padding:8px 18px; font-family:'Share Tech Mono',monospace; font-size:11px;
    letter-spacing:2px; color:#e8c84a; z-index:400; opacity:0; pointer-events:none;
    transition:opacity .3s, transform .3s;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  #toast.error { border-color:rgba(255,60,60,.5); color:#ff6060; }
</style>
</head>

<input type="file" id="file-input" accept="image/*" style="display:none">
<div id="toast"></div>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbynl_m8UZJvdTVGlM_9gtYsvFJA24rCtamGfry-ok_RpUlt-ipqf6HMF4Kn_PlcUW43/exec';

let points = [];
let nextId = 1;
let mode = 'nav';
let activePointId = null;
let pendingPhotoData = null;

// ── Pan/Zoom ──
let scale = 1, tx = 0, ty = 0;
let isPanning = false, startX, startY, startTx, startTy;
const wrapper = document.getElementById('map-wrapper');
const container = document.getElementById('map-container');
const img = document.getElementById('map-img');

function applyTransform() {
  container.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`;
}
function resetView() {
  const iw = img.naturalWidth || img.width;
  const ih = img.naturalHeight || img.height;
  scale = Math.min(window.innerWidth / iw, window.innerHeight / ih, 1);
  tx = (window.innerWidth - iw * scale) / 2;
  ty = (window.innerHeight - ih * scale) / 2;
  applyTransform();
}
function zoomBy(delta) {
  const cx = window.innerWidth/2, cy = window.innerHeight/2;
  const ns = Math.min(Math.max(scale + delta, 0.3), 5);
  tx = cx - (cx - tx) * (ns/scale);
  ty = cy - (cy - ty) * (ns/scale);
  scale = ns; applyTransform();
}

wrapper.addEventListener('mousedown', e => {
  if (mode !== 'nav') return;
  isPanning = true; startX = e.clientX; startY = e.clientY; startTx = tx; startTy = ty;
});
window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  tx = startTx + (e.clientX - startX); ty = startTy + (e.clientY - startY); applyTransform();
});
window.addEventListener('mouseup', () => isPanning = false);
wrapper.addEventListener('wheel', e => {
  e.preventDefault();
  const d = e.deltaY < 0 ? 0.12 : -0.12;
  const ns = Math.min(Math.max(scale + d, 0.3), 5);
  tx = e.clientX - (e.clientX - tx)*(ns/scale);
  ty = e.clientY - (e.clientY - ty)*(ns/scale);
  scale = ns; applyTransform();
}, {passive:false});

let lastTouchDist = null;
wrapper.addEventListener('touchstart', e => {
  if (e.touches.length === 1 && mode === 'nav') {
    isPanning = true; startX = e.touches[0].clientX; startY = e.touches[0].clientY; startTx = tx; startTy = ty;
  }
  if (e.touches.length === 2)
    lastTouchDist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
});
wrapper.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isPanning) {
    tx = startTx+(e.touches[0].clientX-startX); ty = startTy+(e.touches[0].clientY-startY); applyTransform();
  }
  if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (lastTouchDist) zoomBy((dist-lastTouchDist)*0.01);
    lastTouchDist = dist;
  }
}, {passive:false});
wrapper.addEventListener('touchend', () => { isPanning = false; lastTouchDist = null; });

// ── Click to add ──
wrapper.addEventListener('click', e => {
  if (mode !== 'add') return;
  if (e.target.closest('.pt')) return;
  const rect = wrapper.getBoundingClientRect();
  addPoint((e.clientX - rect.left - tx)/scale, (e.clientY - rect.top - ty)/scale);
});

// ── API ──
function apiGet() {
  return new Promise((resolve, reject) => {
    const cbName = 'cb_' + Date.now();
    const script = document.createElement('script');
    window[cbName] = data => {
      delete window[cbName];
      document.body.removeChild(script);
      resolve(data);
    };
    script.onerror = () => reject(new Error('JSONP failed'));
    script.src = SCRIPT_URL + '?callback=' + cbName;
    document.body.appendChild(script);
  });
}
async function apiPost(payload) {
  await fetch(SCRIPT_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(payload)
  });
}

// ── Load points on startup ──
async function loadPoints() {
  try {
    document.getElementById('load-msg').textContent = 'Conectando à planilha...';
    const rows = await apiGet();
    console.log('[DEBUG] Dados brutos da planilha:', JSON.stringify(rows));
    rows.forEach(raw => {
      // Normaliza chaves para minúsculo (planilha pode ter cabeçalho em maiúsculo)
      const r = {};
      Object.keys(raw).forEach(k => { r[k.toLowerCase()] = raw[k]; });
      const parseNum = v => Number(String(v).replace(',', '.'));
      const pt = {
        id: Number(r.id),
        x: parseNum(r.x),
        y: parseNum(r.y),
        name: r.nome || '',
        photo: r.foto || null
      };
      points.push(pt);
      if (pt.id >= nextId) nextId = pt.id + 1;
      renderPoint(pt);
    });
    updateCounter();
  } catch(err) {
    showToast('Erro ao carregar pontos', true);
  } finally {
    document.getElementById('loading').style.display = 'none';
  }
}

// ── Points ──
function addPoint(x, y) {
  const id = nextId++;
  const pt = { id, x, y, name:'', photo:null };
  points.push(pt);
  renderPoint(pt);
  updateCounter();
  openModal(id);
}

function renderPoint(pt) {
  const layer = document.getElementById('points-layer');
  const el = document.createElement('div');
  el.className = 'pt' + (pt.photo ? ' has-photo' : '');
  el.id = 'pt-' + pt.id;
  el.style.left = pt.x + 'px';
  el.style.top = pt.y + 'px';
  el.innerHTML = '<div class="pt-pulse"></div><div class="pt-inner"></div>';
  el.addEventListener('click', e => {
    e.stopPropagation();
    if (mode === 'del') deletePoint(pt.id);
    else openModal(pt.id);
  });
  layer.appendChild(el);
}

async function deletePoint(id) {
  points = points.filter(p => p.id !== id);
  const el = document.getElementById('pt-' + id);
  if (el) el.remove();
  updateCounter();
  showToast('Removendo...');
  await apiPost({ action:'delete', id });
  showToast('Ponto removido!');
}

function updateCounter() {
  document.getElementById('cnt-total').textContent = points.length;
  document.getElementById('cnt-photo').textContent = points.filter(p => p.photo).length;
}

function setMode(m) {
  mode = (mode === m) ? 'nav' : m;
  document.getElementById('btn-add').classList.toggle('active', mode === 'add');
  document.getElementById('btn-del').classList.toggle('active', mode === 'del');
  wrapper.classList.toggle('cursor-add', mode === 'add');
  wrapper.classList.toggle('cursor-del', mode === 'del');
  const labels = {nav:'NAVEGAÇÃO', add:'INSERIR PONTO', del:'REMOVER PONTO'};
  document.getElementById('mode-label').textContent = 'MODO: ' + labels[mode];
}

// ── Tabs ──
function switchTab(tab) {
  document.getElementById('tab-url').classList.toggle('active', tab==='url');
  document.getElementById('tab-file').classList.toggle('active', tab==='file');
  document.getElementById('panel-url').classList.toggle('active', tab==='url');
  document.getElementById('panel-file').classList.toggle('active', tab==='file');
}

function loadUrl() {
  const url = document.getElementById('modal-url-input').value.trim();
  if (!url) return;
  setPreview(url);
  pendingPhotoData = url;
  showToast('Foto carregada!');
}

function setPreview(src) {
  const mi = document.getElementById('modal-img');
  mi.src = src; mi.style.display = 'block';
  document.getElementById('photo-placeholder').style.display = 'none';
}

document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    pendingPhotoData = ev.target.result;
    setPreview(pendingPhotoData);
    showToast('Foto carregada!');
  };
  reader.readAsDataURL(file);
  e.target.value = '';
});

// ── Modal ──
function openModal(id) {
  const pt = points.find(p => p.id === id); if (!pt) return;
  activePointId = id; pendingPhotoData = null;
  document.getElementById('modal-title').textContent = pt.name || ('Container #' + id);
  document.getElementById('modal-id-label').textContent = 'ID: ' + String(id).padStart(4,'0') + '  |  X:' + Math.round(pt.x) + '  Y:' + Math.round(pt.y);
  document.getElementById('modal-name-input').value = pt.name || '';
  document.getElementById('modal-url-input').value = (pt.photo && pt.photo.startsWith('http')) ? pt.photo : '';
  const mi = document.getElementById('modal-img');
  if (pt.photo) { setPreview(pt.photo); }
  else { mi.src=''; mi.style.display='none'; document.getElementById('photo-placeholder').style.display='block'; }
  switchTab('url');
  document.getElementById('modal-overlay').classList.add('open');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  activePointId = null; pendingPhotoData = null;
}

async function savePoint() {
  const pt = points.find(p => p.id === activePointId); if (!pt) return;
  pt.name = document.getElementById('modal-name-input').value.trim();
  if (pendingPhotoData) pt.photo = pendingPhotoData;
  const el = document.getElementById('pt-' + pt.id);
  if (el) el.className = 'pt' + (pt.photo ? ' has-photo' : '');
  updateCounter();
  closeModal();
  showToast('Salvando...');
  await apiPost({ action:'save', id:pt.id, x:pt.x, y:pt.y, nome:pt.name, foto:pt.photo||'' });
  showToast('Salvo na planilha!');
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// ── Toast ──
function showToast(msg, isError=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (isError ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.className = '', 2500);
}

// ── Init ──
function init() {
  const iw = img.naturalWidth;
  const ih = img.naturalHeight;
  if (!iw || !ih) {
    // Dimensions not ready yet, wait a frame
    requestAnimationFrame(init);
    return;
  }
  resetView();
  loadPoints();
}
img.onload = init;
if (img.complete && img.naturalWidth) { init(); }
else if (img.complete) { requestAnimationFrame(init); }
</script>
